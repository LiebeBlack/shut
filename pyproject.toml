[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-shutdown-hub"
version = "1.0.0"
description = "Heuristic shutdown manager and countdown timer for low-power PCs"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2",
  "psutil>=5.9.0",
  "pystray>=0.19.5",
  "pillow>=10.0.0",
  "wmi; python_version < '3.14'",
  "pywin32>=308; python_version < '3.14'",
]

[project.scripts]
sshub = "sshub.app:main"

[tool.setuptools]
packages = [
  "sshub",
  "sshub.core",
  "sshub.sensors",
  "sshub.gui",
  "sshub.gui.assets",
  "sshub.platform_layer",
]

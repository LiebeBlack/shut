name: build-windows-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate multi-size icon (PIL fallback built-in, no cairo)
        run: python -m sshub.gui.assets.make_ico

      - name: Smoke test (dry-run, never touches the OS)
        shell: pwsh
        run: $env:SSHUB_DRY_RUN="1"; python scripts/selftest.py

      - name: Build onefile executable
        run: pyinstaller sshub.spec --clean --noconfirm

      - name: Install Inno Setup (choco)
        run: choco install innosetup --no-progress -y

      - name: Build installer (version from tag when present)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found" }
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($ver -match '^\d+\.\d+\.\d+$') {
            & $iscc.FullName scripts\installer.iss /DMyAppVersion=$ver
          } else {
            & $iscc.FullName scripts\installer.iss
          }

      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist\SmartShutdownHub.exe -Algorithm SHA256 | Out-File -Encoding ascii dist\SmartShutdownHub.exe.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/SmartShutdownHub.exe
            dist/SmartShutdownHub.exe.sha256
            installer/*.exe
          if-no-files-found: warn

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartShutdownHub.exe
            dist/SmartShutdownHub.exe.sha256
            installer/*.exe
          generate_release_notes: true
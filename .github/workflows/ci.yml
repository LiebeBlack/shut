name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "sshub/**"
      - "main.py"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "ruff.toml"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check sshub main.py scripts/selftest.py

      - name: Compile check
        run: python -m py_compile main.py sshub/*.py sshub/core/*.py sshub/gui/*.py sshub/sensors/*.py sshub/platform_layer/*.py scripts/selftest.py

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: $env:SSHUB_DRY_RUN="1"; python scripts/selftest.py
name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "sshub/**"
      - "main.py"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "ruff.toml"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-compile:
    name: windows-latest / py3.12
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check sshub main.py scripts/selftest.py

      - name: Compile check
        run: python -m compileall -q sshub scripts main.py

      - name: Smoke test (dry-run)
        shell: pwsh
        run: $env:SSHUB_DRY_RUN="1"; python scripts/selftest.py